<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#071322" />
    <meta name="color-scheme" content="dark" />
    <title>Battaglia Navale</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="header">
        <h1>Battaglia Navale</h1>
        <p class="subtitle">Client Android — motore Python via HTTP · <span id="app-version">…</span></p>
        <button type="button" id="btn-check-update" class="link-btn">Controlla aggiornamenti GitHub</button>
      </header>

      <section class="card update-banner" id="update-banner" hidden>
        <h2 id="update-title">Aggiornamento disponibile</h2>
        <p id="update-body" class="update-body"></p>
        <p id="update-status" class="status"></p>
        <div class="toolbar">
          <button type="button" id="btn-update" class="btn primary">Scarica e installa</button>
          <button type="button" id="btn-skip-update" class="btn">Più tardi</button>
        </div>
      </section>

      <section class="card" id="setup">
        <label class="field">
          <span>URL server API</span>
          <input id="api-base" type="url" inputmode="url" autocomplete="off" placeholder="http://192.168.1.10:8080" />
        </label>
        <button type="button" id="btn-join" class="btn primary">Entra in partita</button>
        <p id="status" class="status" role="status"></p>
      </section>

      <section class="card" id="panel-controls" hidden>
        <p id="phase-text" class="phase"></p>
        <div class="toolbar">
          <button type="button" id="btn-rotate" class="btn">Ruota</button>
          <button type="button" id="btn-auto" class="btn">Auto</button>
          <button type="button" id="btn-fire" class="btn primary">Conferma</button>
        </div>
        <div class="dpad" aria-label="Controlli direzione">
          <button type="button" class="pad up" data-dir="up" aria-label="Su">&#9650;</button>
          <button type="button" class="pad left" data-dir="left" aria-label="Sinistra">&#9664;</button>
          <button type="button" class="pad right" data-dir="right" aria-label="Destra">&#9654;</button>
          <button type="button" class="pad down" data-dir="down" aria-label="Giù">&#9660;</button>
        </div>
      </section>

      <div class="boards" id="boards" hidden>
        <section class="board-block">
          <h2>Tua flotta</h2>
          <div id="grid-own" class="grid"></div>
        </section>
        <section class="board-block">
          <h2>Nemico</h2>
          <div id="grid-enemy" class="grid target"></div>
        </section>
      </div>
    </div>
    <script src="config.js"></script>
    <script src="update.js"></script>
    <script src="game.js"></script>
  </body>
</html>
