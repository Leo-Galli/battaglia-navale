<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#030712" />
    <meta name="color-scheme" content="dark" />
    <title>Battleship</title>
    <style>
      :root {
        color-scheme: dark;
        --bg-deep: #030712;
        --bg-mid: #0c1929;
        --panel: rgba(10, 25, 47, 0.82);
        --line: rgba(125, 211, 252, 0.18);
        --text: #f1f5f9;
        --muted: #94a3b8;
        --accent: #38bdf8;
        --accent-dim: #0284c7;
        --sea: #0a3d5c;
        --sea-deep: #062a42;
        --ship: #15803d;
        --hit: #b91c1c;
        --miss: #a16207;
        --focus: #7dd3fc;
        font-family: Inter, 'Segoe UI', system-ui, sans-serif;
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        color: var(--text);
        background: var(--bg-deep);
        overflow-x: hidden;
      }
      .ocean {
        position: fixed;
        inset: 0;
        z-index: 0;
        background: radial-gradient(ellipse 90% 50% at 50% -20%, #1e5a7a 0%, transparent 55%),
          linear-gradient(180deg, var(--bg-deep) 0%, var(--bg-mid) 50%, #051018 100%);
      }
      .ocean::after {
        content: '';
        position: absolute;
        inset: 0;
        opacity: 0.35;
        background: repeating-linear-gradient(
          -12deg,
          transparent,
          transparent 48px,
          rgba(56, 189, 248, 0.03) 48px,
          rgba(56, 189, 248, 0.03) 49px
        );
        animation: drift 28s linear infinite;
      }
      @keyframes drift {
        from {
          transform: translateX(0);
        }
        to {
          transform: translateX(-80px);
        }
      }
      .app {
        position: relative;
        z-index: 1;
        width: min(1000px, calc(100% - 1.25rem));
        margin: 0 auto;
        padding: calc(0.85rem + env(safe-area-inset-top)) 0 calc(2.5rem + env(safe-area-inset-bottom));
      }
      .hero {
        text-align: center;
        padding: 0.5rem 0 1.25rem;
      }
      .hero h1 {
        margin: 0;
        font-size: clamp(1.75rem, 5.5vw, 2.5rem);
        font-weight: 800;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--text);
        text-shadow: 0 0 40px rgba(56, 189, 248, 0.35);
      }
      .hero p {
        margin: 0.5rem 0 0;
        color: var(--muted);
        font-size: 0.92rem;
        letter-spacing: 0.02em;
      }
      .player-pill {
        display: inline-block;
        margin-top: 0.65rem;
        padding: 0.25rem 0.75rem;
        border-radius: 999px;
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        border: 1px solid var(--line);
        background: rgba(2, 132, 199, 0.15);
        color: var(--accent);
      }
      .player-pill[hidden] {
        display: none;
      }
      .card {
        margin: 0.85rem 0;
        padding: 1.1rem 1.15rem;
        border-radius: 16px;
        border: 1px solid var(--line);
        background: var(--panel);
        backdrop-filter: blur(16px);
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.04);
      }
      label {
        display: grid;
        gap: 0.45rem;
        font-size: 0.8rem;
        font-weight: 600;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: #cbd5e1;
      }
      input[type='url'] {
        width: 100%;
        padding: 0.75rem 0.9rem;
        border-radius: 10px;
        border: 1px solid #334155;
        background: #020617;
        color: var(--text);
        font-size: 1rem;
        font-weight: 500;
      }
      input:focus {
        outline: 2px solid var(--accent-dim);
        outline-offset: 1px;
      }
      .btn {
        padding: 0.62rem 1.1rem;
        border-radius: 10px;
        border: 1px solid #475569;
        background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%);
        color: var(--text);
        font-weight: 600;
        font-size: 0.9rem;
        cursor: pointer;
        touch-action: manipulation;
        transition: transform 0.1s ease, box-shadow 0.15s ease;
      }
      .btn:hover:not(:disabled) {
        border-color: #64748b;
      }
      .btn:active:not(:disabled) {
        transform: scale(0.98);
      }
      .btn.primary {
        border-color: #0369a1;
        background: linear-gradient(180deg, #0ea5e9 0%, #0284c7 100%);
        color: #f8fafc;
        box-shadow: 0 6px 24px rgba(14, 165, 233, 0.4);
      }
      .btn:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }
      .btn-row {
        display: flex;
        flex-wrap: wrap;
        gap: 0.55rem;
        margin-top: 0.75rem;
      }
      .status {
        min-height: 1.35rem;
        margin-top: 0.55rem;
        color: var(--accent);
        font-size: 0.875rem;
      }
      .phase-banner {
        display: flex;
        align-items: flex-start;
        gap: 0.75rem;
        padding: 0.85rem 1rem;
        border-radius: 12px;
        background: rgba(15, 23, 42, 0.65);
        border: 1px solid rgba(51, 65, 85, 0.9);
      }
      .phase-banner .dot {
        flex-shrink: 0;
        width: 11px;
        height: 11px;
        margin-top: 0.35rem;
        border-radius: 50%;
        background: var(--miss);
        box-shadow: 0 0 12px rgba(251, 191, 36, 0.5);
      }
      .phase-banner.my-turn .dot {
        background: #22c55e;
        box-shadow: 0 0 14px rgba(34, 197, 94, 0.55);
      }
      .phase-banner.win .dot {
        background: var(--accent);
      }
      .phase-banner.lose .dot {
        background: var(--hit);
      }
      #phase-text {
        font-size: 1rem;
        font-weight: 600;
        line-height: 1.45;
      }
      .orient {
        font-size: 0.8rem;
        color: var(--muted);
        margin-top: 0.35rem;
        font-weight: 500;
      }
      .progress-wrap {
        margin-top: 0.75rem;
      }
      .progress-wrap[hidden] {
        display: none;
      }
      .progress-label {
        display: flex;
        justify-content: space-between;
        font-size: 0.72rem;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--muted);
        margin-bottom: 0.35rem;
      }
      .progress {
        height: 7px;
        border-radius: 999px;
        background: #1e293b;
        overflow: hidden;
      }
      .progress > span {
        display: block;
        height: 100%;
        background: linear-gradient(90deg, var(--accent-dim), var(--accent));
        transition: width 0.3s ease;
        box-shadow: 0 0 12px rgba(56, 189, 248, 0.5);
      }
      .boards {
        display: grid;
        gap: 1.5rem;
        margin-top: 0.5rem;
      }
      @media (min-width: 780px) {
        .boards {
          grid-template-columns: 1fr 1fr;
        }
      }
      .board-block h2 {
        margin: 0 0 0.6rem;
        font-size: 0.72rem;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .board-shell {
        padding: 0.65rem;
        border-radius: 14px;
        background: rgba(2, 6, 23, 0.7);
        border: 1px solid rgba(51, 65, 85, 0.85);
        box-shadow: inset 0 2px 12px rgba(0, 0, 0, 0.35);
      }
      .board-grid {
        display: grid;
        grid-template-columns: 1.5rem repeat(10, 1fr);
        grid-template-rows: 1.35rem repeat(10, 1fr);
        gap: 3px;
      }
      .coord {
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 0.62rem;
        font-weight: 700;
        color: #64748b;
        user-select: none;
      }
      .cell {
        aspect-ratio: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: 'JetBrains Mono', ui-monospace, monospace;
        font-size: clamp(0.58rem, 2.4vw, 0.78rem);
        font-weight: 700;
        border: none;
        border-radius: 5px;
        padding: 0;
        background: linear-gradient(160deg, var(--sea) 0%, var(--sea-deep) 100%);
        color: #bae6fd;
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.07);
        touch-action: manipulation;
        transition: transform 0.08s ease;
      }
      .cell.water {
        background: linear-gradient(160deg, #0a3048 0%, var(--sea-deep) 100%);
        color: #475569;
      }
      .cell.ship {
        background: linear-gradient(160deg, #166534 0%, var(--ship) 100%);
        color: #dcfce7;
      }
      .cell.hit {
        background: linear-gradient(160deg, #dc2626 0%, var(--hit) 100%);
        color: #fecaca;
      }
      .cell.miss {
        background: linear-gradient(160deg, #ca8a04 0%, var(--miss) 100%);
        color: #fef3c7;
      }
      .cell.cursor {
        outline: 2px solid var(--focus);
        outline-offset: -2px;
        box-shadow: 0 0 16px rgba(125, 211, 252, 0.45);
        z-index: 1;
      }
      .cell.preview {
        background: linear-gradient(160deg, #0e7490 0%, #155e75 100%);
        color: #ecfeff;
      }
      .cell.bad {
        background: linear-gradient(160deg, #ef4444 0%, #991b1b 100%);
      }
      .grid.target .cell:not(.hit):not(.miss) {
        cursor: crosshair;
      }
      .legend {
        display: flex;
        flex-wrap: wrap;
        gap: 0.65rem 1rem;
        margin-top: 0.85rem;
        font-size: 0.72rem;
        color: var(--muted);
      }
      .legend span {
        display: inline-flex;
        align-items: center;
        gap: 0.35rem;
      }
      .swatch {
        width: 14px;
        height: 14px;
        border-radius: 3px;
        border: 1px solid rgba(255, 255, 255, 0.1);
      }
      .swatch.water {
        background: var(--sea-deep);
      }
      .swatch.ship {
        background: var(--ship);
      }
      .swatch.hit {
        background: var(--hit);
      }
      .swatch.miss {
        background: var(--miss);
      }
      .controls-grid {
        display: grid;
        gap: 1rem;
        margin-top: 0.85rem;
      }
      @media (min-width: 520px) {
        .controls-grid {
          grid-template-columns: 1fr auto;
          align-items: end;
        }
      }
      .dpad {
        display: grid;
        grid-template-columns: repeat(3, 2.85rem);
        grid-template-rows: repeat(3, 2.85rem);
        gap: 0.4rem;
        justify-content: center;
      }
      .pad {
        border-radius: 10px;
        border: 1px solid #334155;
        background: rgba(15, 23, 42, 0.9);
        color: var(--accent);
        font-size: 0.7rem;
        font-weight: 800;
        letter-spacing: 0.02em;
      }
      .pad.up {
        grid-column: 2;
      }
      .pad.down {
        grid-column: 2;
        grid-row: 3;
      }
      .pad.left {
        grid-column: 1;
        grid-row: 2;
      }
      .pad.right {
        grid-column: 3;
        grid-row: 2;
      }
      .hint {
        margin: 0.75rem 0 0;
        font-size: 0.78rem;
        color: #64748b;
        line-height: 1.5;
      }
      .update-banner {
        border-color: rgba(251, 191, 36, 0.35);
        background: rgba(69, 26, 3, 0.45);
      }
      .link-btn {
        background: none;
        border: none;
        color: var(--accent);
        text-decoration: underline;
        cursor: pointer;
        font-size: 0.85rem;
        padding: 0;
        margin-top: 0.5rem;
      }
    </style>
  </head>
  <body>
    <div class="ocean" aria-hidden="true"></div>
    <div class="app">
      <header class="hero">
        <h1>Battleship</h1>
        <p>Classic fleet battle over the network</p>
        <span id="player-pill" class="player-pill" hidden>Player</span>
        <button type="button" id="btn-check-update" class="link-btn" hidden>Check for app updates</button>
      </header>

      <section class="card update-banner" id="update-banner" hidden>
        <h2 id="update-title" style="margin: 0 0 0.35rem; font-size: 1rem">Update available</h2>
        <p id="update-body" class="status" style="margin: 0"></p>
        <p id="update-status" class="status"></p>
        <div class="btn-row">
          <button type="button" id="btn-update" class="btn primary">Download and install</button>
          <button type="button" id="btn-skip-update" class="btn">Later</button>
        </div>
      </section>

      <section class="card" id="setup">
        <label>
          Game server URL
          <input id="api-base" type="url" inputmode="url" autocomplete="off" placeholder="http://192.168.1.10:8080" />
        </label>
        <div class="btn-row">
          <button type="button" id="btn-join" class="btn primary">Join match</button>
        </div>
        <p id="status" class="status" role="status"></p>
      </section>

      <section class="card" id="panel-controls" hidden>
        <div id="phase-banner" class="phase-banner">
          <span class="dot" aria-hidden="true"></span>
          <div>
            <div id="phase-text">Waiting</div>
            <div id="orient-hint" class="orient" hidden></div>
          </div>
        </div>
        <div class="progress-wrap" id="place-progress" hidden>
          <div class="progress-label">
            <span>Fleet deployment</span>
            <span id="place-count">0 / 0</span>
          </div>
          <div class="progress"><span id="place-bar" style="width: 0%"></span></div>
        </div>
        <div class="controls-grid">
          <div class="btn-row" style="margin-top: 0">
            <button type="button" id="btn-rotate" class="btn">Rotate</button>
            <button type="button" id="btn-auto" class="btn">Auto place</button>
            <button type="button" id="btn-fire" class="btn primary">Confirm</button>
            <button type="button" id="btn-rematch" class="btn primary" hidden>New match</button>
          </div>
          <div class="dpad" aria-label="Move cursor">
            <button type="button" class="pad up" data-dir="up" aria-label="Up">N</button>
            <button type="button" class="pad left" data-dir="left" aria-label="Left">W</button>
            <button type="button" class="pad right" data-dir="right" aria-label="Right">E</button>
            <button type="button" class="pad down" data-dir="down" aria-label="Down">S</button>
          </div>
        </div>
        <p class="hint">Tap the enemy grid to fire. Hit grants another shot. Miss passes the turn.</p>
        <div class="legend" aria-hidden="true">
          <span><i class="swatch water"></i> Sea</span>
          <span><i class="swatch ship"></i> Ship</span>
          <span><i class="swatch hit"></i> Hit</span>
          <span><i class="swatch miss"></i> Miss</span>
        </div>
      </section>

      <div class="boards" id="boards" hidden>
        <section class="board-block">
          <h2>Your fleet</h2>
          <div class="board-shell">
            <div id="grid-own" class="board-grid" aria-label="Your grid"></div>
          </div>
        </section>
        <section class="board-block">
          <h2>Enemy waters</h2>
          <div class="board-shell">
            <div id="grid-enemy" class="board-grid target" aria-label="Enemy grid"></div>
          </div>
        </section>
      </div>
    </div>
    <script src="config.js"></script>
    <script src="update.js"></script>
    <script>
      const COLS = 'ABCDEFGHIJ'.split('');
      const SIZE = 10;
      let apiBase = '';
      let token = '';
      let giocatore = 0;
      let cursor = { r: 0, c: 0 };
      let orizzontale = true;
      let polling = null;
      let lastState = null;

      const el = (id) => document.getElementById(id);

      function isNative() {
        return window.Capacitor?.isNativePlatform?.();
      }

      function defaultApiBase() {
        const saved = localStorage.getItem('bn_api_base');
        if (saved) return saved;
        if (isNative()) return 'http://10.0.2.2:8080';
        if (location.protocol.startsWith('http') && location.host) return location.origin;
        return 'http://127.0.0.1:8080';
      }

      function loadApiBase() {
        el('api-base').value = defaultApiBase();
        if (isNative()) el('btn-check-update').hidden = false;
      }

      async function api(path, opts = {}) {
        const res = await fetch(`${apiBase.replace(/\/$/, '')}${path}`, {
          ...opts,
          headers: { 'Content-Type': 'application/json', ...(opts.headers || {}) },
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.motivo || data.errore || res.statusText);
        return data;
      }

      function sym(ch) {
        return { '.': '.', N: '#', X: 'X', O: 'o' }[ch] || ch;
      }

      function paintGrid(container, matrix, opts = {}) {
        container.replaceChildren();
        const corner = document.createElement('span');
        corner.className = 'coord';
        container.appendChild(corner);
        for (let c = 0; c < SIZE; c++) {
          const h = document.createElement('span');
          h.className = 'coord';
          h.textContent = COLS[c];
          container.appendChild(h);
        }
        for (let r = 0; r < SIZE; r++) {
          const rowLabel = document.createElement('span');
          rowLabel.className = 'coord';
          rowLabel.textContent = String(r + 1);
          container.appendChild(rowLabel);
          for (let c = 0; c < SIZE; c++) {
            const ch = matrix[r][c];
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'cell';
            btn.dataset.r = String(r);
            btn.dataset.c = String(c);
            btn.textContent = sym(ch);
            btn.setAttribute('aria-label', `${COLS[c]}${r + 1}`);
            if (ch === '.') btn.classList.add('water');
            if (ch === 'N') btn.classList.add('ship');
            if (ch === 'X') btn.classList.add('hit');
            if (ch === 'O') btn.classList.add('miss');
            if (opts.cursor && opts.cursor.r === r && opts.cursor.c === c) btn.classList.add('cursor');
            if (opts.preview?.has(`${r},${c}`)) btn.classList.add('preview');
            if (opts.bad?.has(`${r},${c}`)) btn.classList.add('bad');
            container.appendChild(btn);
          }
        }
      }

      function previewCells(state) {
        const set = new Set();
        const bad = new Set();
        if (state.fase !== 'posizionamento' || !state.prossima_lunghezza) return { set, bad };
        const len = state.prossima_lunghezza;
        for (let i = 0; i < len; i++) {
          const r = cursor.r + (orizzontale ? 0 : i);
          const c = cursor.c + (orizzontale ? i : 0);
          if (r >= 0 && r < SIZE && c >= 0 && c < SIZE) {
            set.add(`${r},${c}`);
            if (state.propria[r][c] !== '.') bad.add(`${r},${c}`);
          } else bad.add(`${cursor.r},${cursor.c}`);
        }
        return { set, bad };
      }

      function render(state) {
        lastState = state;
        const placing = state.fase === 'posizionamento' && state.prossima_lunghezza;
        const myTurn = state.fase === 'battaglia' && state.turno === giocatore;
        const prev = placing ? previewCells(state) : { set: new Set(), bad: new Set() };

        paintGrid(el('grid-own'), state.propria, {
          cursor: placing ? cursor : null,
          preview: prev.set,
          bad: prev.bad,
        });
        paintGrid(el('grid-enemy'), state.nemica, { cursor: myTurn ? cursor : null });

        const banner = el('phase-banner');
        banner.classList.remove('my-turn', 'win', 'lose');
        if (state.fase === 'fine') {
          banner.classList.add(state.vincitore === giocatore ? 'win' : 'lose');
        } else if (myTurn) {
          banner.classList.add('my-turn');
        }

        let phaseMsg = '';
        if (state.attesa_avversario) {
          phaseMsg = `Waiting for second player (${state.giocatore}/2)`;
        } else if (placing) {
          phaseMsg = `Deploy length-${state.prossima_lunghezza} ship at ${COLS[cursor.c]}${cursor.r + 1}`;
        } else if (state.fase === 'fine') {
          phaseMsg = state.vincitore === giocatore ? 'All enemy ships destroyed. You win.' : 'Your fleet is lost.';
        } else if (myTurn) {
          phaseMsg = 'Your turn. Target coordinates on the enemy grid.';
        } else {
          phaseMsg = `Opponent (player ${state.turno}) is targeting.`;
        }
        el('phase-text').textContent = phaseMsg;

        const orient = el('orient-hint');
        if (placing) {
          orient.hidden = false;
          orient.textContent = `Orientation: ${orizzontale ? 'horizontal' : 'vertical'} (Rotate to change)`;
        } else {
          orient.hidden = true;
        }

        const prog = el('place-progress');
        if (placing && state.navi_totali) {
          prog.hidden = false;
          const done = state.navi_piazzate || 0;
          const total = state.navi_totali;
          el('place-count').textContent = `${done} / ${total}`;
          el('place-bar').style.width = `${Math.round((100 * done) / total)}%`;
        } else {
          prog.hidden = true;
        }

        el('btn-rotate').hidden = !placing;
        el('btn-auto').hidden = !placing;
        el('btn-fire').textContent = placing ? 'Place ship' : myTurn ? 'Fire' : 'Wait';
        el('btn-fire').disabled = !placing && !myTurn;
        el('btn-rematch').hidden = state.fase !== 'fine';
      }

      async function refresh() {
        const state = await api(`/api/stato?token=${encodeURIComponent(token)}`);
        render(state);
        if (state.fase === 'fine' && polling) {
          clearInterval(polling);
          polling = null;
        }
      }

      async function join() {
        apiBase = el('api-base').value.trim() || defaultApiBase();
        localStorage.setItem('bn_api_base', apiBase);
        el('status').textContent = 'Connecting...';
        const data = await api('/api/unisciti', { method: 'POST', body: '{}' });
        token = data.token;
        giocatore = data.giocatore;
        const pill = el('player-pill');
        pill.hidden = false;
        pill.textContent = `Player ${giocatore}`;
        el('status').textContent = `Connected ${data.connessi} of ${data.richiesti} players`;
        el('boards').hidden = false;
        el('panel-controls').hidden = false;
        el('setup').hidden = true;
        await refresh();
        if (polling) clearInterval(polling);
        polling = setInterval(() => refresh().catch((e) => (el('status').textContent = e.message)), 1000);
      }

      async function confirm() {
        if (!lastState) return;
        if (lastState.fase === 'posizionamento' && lastState.prossima_lunghezza) {
          await api('/api/piazza', {
            method: 'POST',
            body: JSON.stringify({ token, riga: cursor.r, colonna: cursor.c, orizzontale }),
          });
        } else if (lastState.turno === giocatore) {
          const ch = lastState.nemica[cursor.r][cursor.c];
          if (ch === 'X' || ch === 'O') {
            el('status').textContent = 'Already fired at this cell.';
            return;
          }
          await api('/api/spara', {
            method: 'POST',
            body: JSON.stringify({ token, riga: cursor.r, colonna: cursor.c }),
          });
        }
        el('status').textContent = '';
        await refresh();
      }

      function move(dr, dc) {
        cursor.r = Math.max(0, Math.min(SIZE - 1, cursor.r + dr));
        cursor.c = Math.max(0, Math.min(SIZE - 1, cursor.c + dc));
        if (lastState) render(lastState);
      }

      async function autoPlace() {
        if (!lastState?.prossima_lunghezza) return;
        const len = lastState.prossima_lunghezza;
        for (const horiz of [true, false]) {
          for (let r = 0; r < SIZE; r++) {
            for (let c = 0; c < SIZE; c++) {
              let ok = true;
              for (let i = 0; i < len; i++) {
                const rr = r + (horiz ? 0 : i);
                const cc = c + (horiz ? i : 0);
                if (rr >= SIZE || cc >= SIZE || lastState.propria[rr][cc] !== '.') {
                  ok = false;
                  break;
                }
              }
              if (ok) {
                orizzontale = horiz;
                cursor = { r, c };
                await api('/api/piazza', {
                  method: 'POST',
                  body: JSON.stringify({ token, riga: r, colonna: c, orizzontale: horiz }),
                });
                await refresh();
                return;
              }
            }
          }
        }
        el('status').textContent = 'No valid slot for auto placement.';
      }

      async function rematch() {
        await api('/api/rematch', { method: 'POST', body: JSON.stringify({ token }) });
        await refresh();
        if (!polling) {
          polling = setInterval(() => refresh().catch((e) => (el('status').textContent = e.message)), 1000);
        }
      }

      el('btn-join').addEventListener('click', () => join().catch((e) => (el('status').textContent = e.message)));
      el('btn-fire').addEventListener('click', () => confirm().catch((e) => (el('status').textContent = e.message)));
      el('btn-rotate').addEventListener('click', () => {
        orizzontale = !orizzontale;
        if (lastState) render(lastState);
      });
      el('btn-auto').addEventListener('click', () => autoPlace().catch((e) => (el('status').textContent = e.message)));
      el('btn-rematch').addEventListener('click', () => rematch().catch((e) => (el('status').textContent = e.message)));

      document.querySelectorAll('.pad').forEach((btn) => {
        btn.addEventListener('click', () => {
          const d = btn.dataset.dir;
          if (d === 'up') move(-1, 0);
          if (d === 'down') move(1, 0);
          if (d === 'left') move(0, -1);
          if (d === 'right') move(0, 1);
        });
      });

      el('grid-enemy').addEventListener('click', (ev) => {
        const t = ev.target;
        if (!(t instanceof HTMLElement) || !t.dataset.r) return;
        cursor.r = Number(t.dataset.r);
        cursor.c = Number(t.dataset.c);
        if (lastState?.fase === 'battaglia' && lastState.turno === giocatore) {
          confirm().catch((e) => (el('status').textContent = e.message));
        } else if (lastState) render(lastState);
      });

      window.addEventListener('keydown', (ev) => {
        const k = ev.key;
        if (['ArrowUp', 'w', 'W', 'k', 'K'].includes(k)) {
          ev.preventDefault();
          move(-1, 0);
        } else if (['ArrowDown', 's', 'S', 'j', 'J'].includes(k)) {
          ev.preventDefault();
          move(1, 0);
        } else if (['ArrowLeft', 'a', 'A', 'h', 'H'].includes(k)) {
          ev.preventDefault();
          move(0, -1);
        } else if (['ArrowRight', 'd', 'D', 'l', 'L'].includes(k)) {
          ev.preventDefault();
          move(0, 1);
        } else if (k === 'r' || k === 'R' || k === ' ') {
          ev.preventDefault();
          orizzontale = !orizzontale;
          if (lastState) render(lastState);
        } else if (k === '0') {
          ev.preventDefault();
          autoPlace().catch((e) => (el('status').textContent = e.message));
        } else if (k === 'Enter') {
          ev.preventDefault();
          confirm().catch((e) => (el('status').textContent = e.message));
        }
      });

      loadApiBase();
    </script>
  </body>
</html>
